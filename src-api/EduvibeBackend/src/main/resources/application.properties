# ---------------------------------------------------------------------------
# Base de datos (PostgreSQL)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${BBDD_HOST:localhost}:${BBDD_PORT:5432}/${BBDD_NAME:eduvibe}
spring.datasource.username=${DATABASE_USERNAME:eduvibe}
spring.datasource.password=${DATABASE_PASSWORD:eduvibe}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo crean y versionan las migraciones de Flyway. Hibernate solo
# comprueba que las entidades encajan con lo que hay: nunca lo modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# db/demo contiene la semilla de demostración. Para no cargarla:
#   FLYWAY_LOCATIONS=classpath:db/migration
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=${APP_PORT:9090}

# ---------------------------------------------------------------------------
# Correo (invitaciones de alta)
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------------
# Aplicación
# ---------------------------------------------------------------------------
# Orígenes autorizados para CORS, separados por comas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

# Secreto de firma del JWT. Si no se define, se genera uno aleatorio al arrancar.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# URL pública del frontend, para construir los enlaces de invitación.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Validez de una invitación de alta, en horas.
app.invitation.expiration-hours=${INVITATION_EXPIRATION_HOURS:48}

# Límite de intentos de login: tras N fallos seguidos de un email se bloquea
# ese email durante M minutos.
app.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
app.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}

# ---------------------------------------------------------------------------
# Archivos subidos (portadas de clase, materiales, entregas)
# ---------------------------------------------------------------------------
# Carpeta en disco donde se guardan. En Docker apunta a un volumen; en local
# es relativa al directorio desde el que arranca el backend.
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Paginación: 10 por página salvo que el cliente pida otra cosa, con un tope para
# que un size=100000 no pueda traerse la tabla entera de golpe.
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
