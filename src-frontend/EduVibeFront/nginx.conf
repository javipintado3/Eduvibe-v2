# Configuración Global
worker_processes 1;
events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Bloque del servidor para la aplicación Angular
    server {
        listen 80;
        server_name localhost;

        # La API y los archivos subidos se sirven por el mismo origen que el frontend:
        # el navegador no necesita saber dónde está la API ni hay problemas de CORS.
        client_max_body_size 15m;

        location /api/ {
            proxy_pass http://eduvibe_api:9090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://eduvibe_api:9090;
            proxy_set_header Host $host;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
