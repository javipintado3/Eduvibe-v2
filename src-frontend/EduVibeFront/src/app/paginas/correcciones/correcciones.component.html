<div class="contenedor">

  <div class="mb-3">
    <h1>Calificar</h1>
    <p class="apagado mb-0">
      Entregas pendientes de corregir en todas tus clases, las más antiguas primero.
    </p>
  </div>

  <app-aviso class="mb-2" tipo="error" [mensaje]="error()"></app-aviso>

  <app-tabla-datos
    [columnas]="columnas"
    [filas]="entregas()"
    [idFila]="idEntrega"
    [cargando]="cargando()"
    [pagina]="pagina()?.pagina ?? 0"
    [totalPaginas]="pagina()?.totalPaginas ?? 1"
    [totalElementos]="pagina()?.totalElementos ?? null"
    etiqueta="entrega(s) pendiente(s)"
    (paginaCambia)="cargar($event)"
    tituloVacio="Todo corregido"
    descripcionVacia="No tienes entregas pendientes. Cuando el alumnado entregue algo, aparecerá aquí.">

    <ng-template appCeldaTabla="assignmentTitle" let-entrega>
      <a [routerLink]="['/tareas', entrega.assignmentId]" class="fuerte">{{ entrega.assignmentTitle }}</a>
      <span class="pastilla pastilla-roja separado" *ngIf="entrega.entregadaTarde">Tarde</span>
    </ng-template>

    <ng-template appCeldaTabla="className" let-entrega>
      <a [routerLink]="['/clases', entrega.classId]">{{ entrega.className }}</a>
    </ng-template>

    <ng-template appCeldaTabla="studentName" let-entrega>
      <ng-container *ngIf="entrega.groupName; else alumnoSuelto">
        {{ entrega.groupName }}
        <span class="pastilla pastilla-gris separado">Grupo</span>
      </ng-container>
      <ng-template #alumnoSuelto>{{ entrega.studentName }}</ng-template>
    </ng-template>

    <ng-template appCeldaTabla="submittedAt" let-entrega>
      <span class="pequeno apagado">{{ entrega.submittedAt | fecha }}</span>
    </ng-template>
  </app-tabla-datos>
</div>
