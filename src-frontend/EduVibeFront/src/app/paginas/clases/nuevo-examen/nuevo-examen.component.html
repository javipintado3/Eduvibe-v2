<div class="contenedor-estrecho" *ngIf="cargando() || errorCarga()">
  <app-cargando *ngIf="cargando()"></app-cargando>
  <app-aviso class="mt-3" tipo="error" [mensaje]="errorCarga()"></app-aviso>
</div>

<app-pagina-formulario *ngIf="clase() as detalle"
  titulo="Nuevo examen"
  [descripcion]="'En la clase ' + detalle.name"
  formId="form-examen"
  [rutaVolver]="['/clases', claseId]"
  textoGuardar="Crear examen"
  textoGuardando="Creando…"
  [guardando]="guardando()"
  [error]="error()">

  <form [formGroup]="formulario" (ngSubmit)="guardar()" novalidate id="form-examen">

    <app-seccion-formulario titulo="Datos del examen">
      <app-campo etiqueta="Título" para="titulo-examen" [requerido]="true" [error]="errorDe('title')">
        <input id="titulo-examen" class="entrada" formControlName="title" placeholder="Examen del segundo trimestre"
               [class.invalida]="errorDe('title')" (blur)="recortarTitulo()">
      </app-campo>

      <app-campo etiqueta="Descripción" para="enunciado-examen">
        <textarea id="enunciado-examen" class="area" formControlName="description"
                  placeholder="Qué entra y cómo se corrige." (blur)="recortarDescripcion()"></textarea>
      </app-campo>

      <app-campo *ngIf="detalle.temas.length" [etiqueta]="etiquetaUnidad" para="tema-examen">
        <select id="tema-examen" class="selector" formControlName="topicId">
          <option value="">{{ etiquetaSinUnidad }}</option>
          <option *ngFor="let tema of detalle.temas" [value]="tema.id">{{ tema.title }}</option>
        </select>
      </app-campo>
    </app-seccion-formulario>

    <app-seccion-formulario titulo="Duración y plazo">
      <app-campo etiqueta="Duración (minutos)" para="duracion" [requerido]="true" [error]="errorDe('durationMinutes')">
        <input id="duracion" type="number" min="1" max="480" class="entrada" formControlName="durationMinutes"
               [class.invalida]="errorDe('durationMinutes')">
      </app-campo>

      <app-campo etiqueta="Fecha límite" para="fecha-examen" ayuda="Opcional. Sin fecha, el examen no vence.">
        <input id="fecha-examen" type="datetime-local" class="entrada" formControlName="dueDate">
      </app-campo>
    </app-seccion-formulario>

    <app-seccion-formulario *ngIf="banco().length" titulo="Banco de preguntas">
      <p class="pequeno apagado mb-2">Preguntas ya usadas en otros exámenes de esta clase. Se copian, así que retocarlas aquí no afecta al examen original.</p>

      <div class="pregunta-banco" *ngFor="let pregunta of banco()">
        <label class="fila espaciado-sm">
          <input type="checkbox" [checked]="estaEnBanco(pregunta.id)"
                 (change)="alternarDelBanco(pregunta, $any($event.target).checked)">
          <span class="crecer" style="min-width:0">
            <span class="texto-pregunta-banco">{{ pregunta.text }}</span>
            <span class="pequeno apagado bloque">De "{{ pregunta.examTitle }}" · {{ pregunta.options.length }} opciones</span>
          </span>
          <input type="number" min="1" class="entrada entrada-corta" *ngIf="estaEnBanco(pregunta.id)"
                 [value]="seleccionBanco().get(pregunta.id)"
                 (input)="actualizarPuntosDelBanco(pregunta.id, +$any($event.target).value)">
        </label>
      </div>
    </app-seccion-formulario>

    <app-seccion-formulario titulo="Preguntas nuevas">
      <div class="fila-entre mb-2">
        <p class="pequeno apagado mb-0">Cada pregunta necesita al menos dos opciones y una sola correcta.</p>
        <button type="button" class="boton boton-contorno boton-pequeno" (click)="anadirPregunta()">
          Añadir pregunta
        </button>
      </div>

      <p class="pequeno apagado mb-2" *ngIf="!preguntas.length">
        Este examen usará solo preguntas del banco, sin ninguna nueva.
      </p>

      <div formArrayName="questions">
        <div class="pregunta" *ngFor="let pregunta of preguntas.controls; let i = index" [formGroupName]="i">

          <div class="fila-entre mb-2">
            <span class="numero-pregunta">Pregunta {{ i + 1 }}</span>
            <button type="button" class="boton-quitar"
                    (click)="quitarPregunta(i)" aria-label="Quitar pregunta">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="fila-pregunta">
            <div class="campo crecer mb-0">
              <input class="entrada" formControlName="text" placeholder="Texto de la pregunta"
                     [class.invalida]="invalido(pregunta.get('text'))">
            </div>

            <div class="campo mb-0">
              <label class="etiqueta">Puntos</label>
              <input type="number" min="1" class="entrada entrada-corta" formControlName="points">
            </div>
          </div>

          <div class="rejilla-opciones mt-2" formArrayName="options">
            <div class="opcion" *ngFor="let opcion of opcionesDe(i).controls; let j = index" [formGroupName]="j">
              <input type="radio" [name]="'correcta-' + i" [checked]="opcion.get('correct')?.value"
                     (change)="marcarCorrecta(i, j)" [attr.aria-label]="'Opción ' + (j + 1) + ' correcta'">
              <input class="entrada" formControlName="text" [placeholder]="'Opción ' + (j + 1)"
                     [class.invalida]="invalido(opcion.get('text'))">
              <button type="button" class="boton-quitar" *ngIf="opcionesDe(i).length > 2"
                      (click)="quitarOpcion(i, j)" aria-label="Quitar opción">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>

          <button type="button" class="boton boton-fantasma boton-pequeno mt-1" (click)="anadirOpcion(i)">
            Añadir opción
          </button>
        </div>
      </div>
    </app-seccion-formulario>
  </form>
</app-pagina-formulario>
