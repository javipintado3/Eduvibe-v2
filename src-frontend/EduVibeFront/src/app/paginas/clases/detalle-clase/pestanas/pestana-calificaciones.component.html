<app-aviso class="mb-2" tipo="error" [mensaje]="error()"></app-aviso>

<app-cargando *ngIf="cargando()"></app-cargando>

<ng-container *ngIf="!cargando()">

  <div class="resumen mb-3" *ngIf="media() !== null">
    <div>
      <p class="pequeno apagado mb-0">Media ponderada de lo corregido</p>
      <p class="media mb-0">{{ media() }}%</p>
    </div>
    <p class="pequeno apagado mb-0">
      {{ calificadas().length }} de {{ entregas().length }} entrega(s) calificada(s)
    </p>
  </div>
  <app-tabla-datos
    [columnas]="columnas"
    [filas]="paginacion.visibles()"
    [pagina]="paginacion.pagina()"
    [totalPaginas]="paginacion.totalPaginas()"
    [totalElementos]="paginacion.total()"
    etiqueta="entrega(s)"
    (paginaCambia)="paginacion.irA($event)"
    tituloVacio="Todavía no has entregado nada"
    descripcionVacia="Las tareas que entregues aparecerán aquí con su calificación.">

    <ng-template appCeldaTabla="assignmentTitle" let-entrega>
      <a [routerLink]="['/tareas', entrega.assignmentId]" class="fuerte">{{ entrega.assignmentTitle }}</a>
      <span class="pastilla pastilla-roja separado" *ngIf="entrega.entregadaTarde">Tarde</span>
      <span class="pastilla pastilla-gris separado" *ngIf="entrega.weight !== 1">
        Peso {{ entrega.weight }}
      </span>
    </ng-template>

    <ng-template appCeldaTabla="status" let-entrega>
      <app-pastilla-estado [valor]="entrega.status"></app-pastilla-estado>
    </ng-template>

    <ng-template appCeldaTabla="submittedAt" let-entrega>
      <span class="pequeno apagado">{{ entrega.submittedAt | fecha }}</span>
    </ng-template>

    <ng-template appCeldaTabla="grade" let-entrega>
      <span class="nota" *ngIf="entrega.grade">{{ entrega.grade.score }}</span>
      <span class="apagado" *ngIf="!entrega.grade">—</span>
    </ng-template>
  </app-tabla-datos>
</ng-container>
