<div class="fila-entre mb-2" *ngIf="puedoEditar">
  <p class="pequeno apagado mb-0">Los exámenes se agrupan por {{ etiquetaUnidadMinuscula }}.</p>
  <a class="boton boton-primario boton-pequeno" [routerLink]="['/clases', claseId, 'examenes', 'nuevo']"
     [queryParams]="temaFiltro ? { tema: temaFiltro } : null">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Nuevo examen
  </a>
</div>

<app-aviso class="mb-2" tipo="error" [mensaje]="error()"></app-aviso>

<app-cargando *ngIf="cargando()"></app-cargando>

<ng-container *ngIf="!cargando()">

  <app-tabla-datos
    [columnas]="columnas()"
    [filas]="lista.visibles()"
    [filtros]="lista.filtros()"
    (limpiarFiltros)="lista.limpiarFiltros()"
    [orden]="lista.orden()"
    (ordenCambia)="lista.ordenar($event)"
    [pagina]="lista.pagina()"
    [totalPaginas]="lista.totalPaginas()"
    [totalElementos]="lista.total()"
    etiqueta="examen(es)"
    (paginaCambia)="lista.irA($event)"
    [tituloVacio]="lista.sinFiltrar() ? 'Ningún examen coincide' : 'Todavía no hay exámenes'"
    [descripcionVacia]="lista.sinFiltrar()
      ? 'Prueba con otra búsqueda o quita los filtros.'
      : puedoEditar ? 'Crea el primer examen de la clase.' : 'Cuando el profesorado publique un examen, aparecerá aquí.'">

    <ng-template appCeldaTabla="title" let-examen>
      <a [routerLink]="['/examenes', examen.id]" class="fuerte">{{ examen.title }}</a>
    </ng-template>

    <ng-template appCeldaTabla="dueDate" let-examen>
      <ng-container *ngIf="examen.dueDate; else sinFecha">
        {{ examen.dueDate | plazo }}
        <span class="pequeno apagado bloque">{{ examen.dueDate | fecha }}</span>
      </ng-container>
      <ng-template #sinFecha><span class="apagado">Sin fecha límite</span></ng-template>
    </ng-template>

    <ng-template appCeldaTabla="durationMinutes" let-examen>{{ examen.durationMinutes }} min</ng-template>

    <ng-template appCeldaTabla="estado" let-examen>
      <!-- Alumnado: su nota y su estado; profesorado: cuántos intentos lleva recibidos -->
      <ng-container *ngIf="examen.intentosRecibidos === null; else recibidos">
        <span class="pastilla pastilla-verde separado" *ngIf="examen.miEstado === 'entregado'">{{ examen.miNota }} pts</span>
        <app-pastilla-estado [valor]="estadoDe(examen)"></app-pastilla-estado>
      </ng-container>
      <ng-template #recibidos>
        <span class="pastilla pastilla-gris">{{ examen.intentosRecibidos }} intento(s)</span>
      </ng-template>
    </ng-template>
  </app-tabla-datos>
</ng-container>
