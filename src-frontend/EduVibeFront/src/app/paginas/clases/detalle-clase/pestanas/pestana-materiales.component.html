<div class="fila-entre mb-2" *ngIf="puedoEditar">
  <p class="pequeno apagado mb-0">Apuntes, enlaces y vídeos de la clase.</p>
  <button type="button" class="boton boton-primario boton-pequeno" (click)="abrirCrear()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Nuevo material
  </button>
</div>

<app-aviso class="mb-2" tipo="error" [mensaje]="error()"></app-aviso>

<app-cargando *ngIf="cargando()"></app-cargando>

<ng-container *ngIf="!cargando()">

  <app-tabla-datos
    [columnas]="columnas()"
    [filas]="lista.visibles()"
    [filtros]="lista.filtros()"
    (limpiarFiltros)="lista.limpiarFiltros()"
    [orden]="lista.orden()"
    (ordenCambia)="lista.ordenar($event)"
    [pagina]="lista.pagina()"
    [totalPaginas]="lista.totalPaginas()"
    [totalElementos]="lista.total()"
    etiqueta="material(es)"
    (paginaCambia)="lista.irA($event)"
    [tituloVacio]="lista.sinFiltrar() ? 'Ningún material coincide' : 'Todavía no hay materiales'"
    [descripcionVacia]="lista.sinFiltrar()
      ? 'Prueba con otra búsqueda o quita los filtros.'
      : puedoEditar ? 'Sube el primer apunte, enlace o vídeo de la clase.' : 'Cuando el profesorado suba materiales, aparecerán aquí.'">

    <ng-template appCeldaTabla="title" let-material>
      <a class="fuerte enlace-material" *ngIf="material.fileUrl" [href]="material.fileUrl | rutaArchivo" target="_blank" rel="noopener">
        {{ material.title }}
      </a>
      <span class="fuerte" *ngIf="!material.fileUrl">{{ material.title }}</span>
    </ng-template>

    <ng-template appCeldaTabla="type" let-material>
      <app-pastilla-estado *ngIf="material.type" [valor]="material.type"></app-pastilla-estado>
      <span class="apagado" *ngIf="!material.type">—</span>
    </ng-template>

    <ng-template appCeldaTabla="availableFrom" let-material>
      <span class="pastilla pastilla-ambar" *ngIf="material.bloqueado">
        Se ve a partir del {{ material.availableFrom | fecha }}
      </span>
      <span class="pequeno apagado" *ngIf="!material.bloqueado && material.availableFrom">
        {{ puedoEditar ? 'Programado: ' : '' }}{{ material.availableFrom | fecha }}
      </span>
      <span class="apagado" *ngIf="!material.availableFrom">—</span>
    </ng-template>

    <ng-template appCeldaTabla="acciones" let-material>
      <span class="fila espaciado-sm">
        <button type="button" class="boton boton-fantasma boton-pequeno"
                (click)="abrirEditar(material)" aria-label="Editar material">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
            <path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/>
          </svg>
        </button>
        <button type="button" class="boton boton-fantasma boton-pequeno"
                [disabled]="borrando() === material.id" (click)="borrar(material)" aria-label="Retirar material">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/>
          </svg>
        </button>
      </span>
    </ng-template>
  </app-tabla-datos>
</ng-container>

<!-- Alta / edición de material -->
<app-dialogo [abierto]="dialogoAbierto()" [titulo]="editando() ? 'Editar material' : 'Nuevo material'"
             [cierraAlPulsarFuera]="false" (cerrar)="dialogoAbierto.set(false)">

  <app-aviso class="mb-2" tipo="error" [mensaje]="errorFormulario()"></app-aviso>

  <form [formGroup]="formulario" (ngSubmit)="guardar()" novalidate id="form-material">

    <div class="campo">
      <label class="etiqueta" for="titulo-material">Título</label>
      <input id="titulo-material" class="entrada" formControlName="title" placeholder="Apuntes de la unidad 1">
    </div>

    <div class="campo">
      <label class="etiqueta">Archivo o enlace</label>
      <app-subida-archivo formControlName="fileUrl" tipo="documento"></app-subida-archivo>
      <span class="ayuda-campo">Opcional</span>
    </div>

    <div class="dos-columnas">
      <div class="campo">
        <label class="etiqueta" for="tipo-material">Tipo</label>
        <select id="tipo-material" class="selector" formControlName="type">
          <option value="">Sin especificar</option>
          <option value="pdf">PDF</option>
          <option value="link">Enlace</option>
          <option value="video">Vídeo</option>
          <option value="doc">Documento</option>
          <option value="other">Otro</option>
        </select>
      </div>

      <div class="campo mb-0" *ngIf="temas.length">
        <label class="etiqueta" for="tema-material">{{ etiquetaUnidad }}</label>
        <select id="tema-material" class="selector" formControlName="topicId">
          <option value="">{{ etiquetaSinUnidad }}</option>
          <option *ngFor="let tema of temas" [value]="tema.id">{{ tema.title }}</option>
        </select>
      </div>
    </div>

    <div class="campo mb-0">
      <label class="etiqueta" for="disponible-desde">Visible para el alumnado a partir de</label>
      <input id="disponible-desde" type="datetime-local" class="entrada" formControlName="availableFrom">
      <span class="ayuda-campo">Opcional: sin fecha, se ve en cuanto se publica</span>
    </div>
  </form>

  <ng-container acciones>
    <button type="button" class="boton boton-contorno" (click)="dialogoAbierto.set(false)">Cancelar</button>
    <button type="submit" form="form-material" class="boton boton-primario" [disabled]="guardando()">
      {{ guardando() ? 'Guardando…' : (editando() ? 'Guardar cambios' : 'Añadir material') }}
    </button>
  </ng-container>
</app-dialogo>
