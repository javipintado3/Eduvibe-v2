<div class="fila-entre mb-2" *ngIf="puedoEditar">
  <p class="pequeno apagado mb-0">Las tareas se agrupan por {{ etiquetaUnidadMinuscula }}.</p>
  <a class="boton boton-primario boton-pequeno" [routerLink]="['/clases', claseId, 'tareas', 'nueva']"
     [queryParams]="temaFiltro ? { tema: temaFiltro } : null">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Nueva tarea
  </a>
</div>

<app-aviso class="mb-2" tipo="error" [mensaje]="error()"></app-aviso>

<app-cargando *ngIf="cargando()"></app-cargando>

<ng-container *ngIf="!cargando()">

  <app-tabla-datos
    [columnas]="columnas()"
    [filas]="lista.visibles()"
    [filtros]="lista.filtros()"
    (limpiarFiltros)="lista.limpiarFiltros()"
    [orden]="lista.orden()"
    (ordenCambia)="lista.ordenar($event)"
    [pagina]="lista.pagina()"
    [totalPaginas]="lista.totalPaginas()"
    [totalElementos]="lista.total()"
    etiqueta="tarea(s)"
    (paginaCambia)="lista.irA($event)"
    [tituloVacio]="lista.sinFiltrar() ? 'Ninguna tarea coincide' : 'Todavía no hay tareas'"
    [descripcionVacia]="lista.sinFiltrar()
      ? 'Prueba con otra búsqueda o quita los filtros.'
      : puedoEditar ? 'Crea la primera tarea de la clase.' : 'Cuando el profesorado publique una tarea, aparecerá aquí.'">

    <ng-template appCeldaTabla="title" let-tarea>
      <a [routerLink]="['/tareas', tarea.id]" class="fuerte">{{ tarea.title }}</a>
    </ng-template>

    <ng-template appCeldaTabla="dueDate" let-tarea>
      <ng-container *ngIf="tarea.dueDate; else sinFecha">
        {{ tarea.dueDate | plazo }}
        <span class="pequeno apagado bloque">{{ tarea.dueDate | fecha }}</span>
      </ng-container>
      <ng-template #sinFecha><span class="apagado">Sin fecha límite</span></ng-template>
    </ng-template>

    <ng-template appCeldaTabla="estado" let-tarea>
      <!-- Alumnado: el estado de su entrega; profesorado: cuántas lleva recibidas -->
      <ng-container *ngIf="tarea.entregasRecibidas === null; else recibidas">
        <span class="pastilla pastilla-roja separado" *ngIf="tarea.miEntregaTarde">Tarde</span>
        <app-pastilla-estado [valor]="estadoDe(tarea)"></app-pastilla-estado>
      </ng-container>
      <ng-template #recibidas>
        <span class="pastilla pastilla-gris">{{ tarea.entregasRecibidas }} entrega(s)</span>
      </ng-template>
    </ng-template>
  </app-tabla-datos>
</ng-container>
