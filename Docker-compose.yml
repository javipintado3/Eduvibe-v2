services:
  db:
    image: postgres:16-alpine
    container_name: eduvibe-postgres
    restart: unless-stopped
    ports:
      - "${BBDD_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${BBDD_NAME:-eduvibe}
      POSTGRES_USER: ${DATABASE_USERNAME:-eduvibe}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-eduvibe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-eduvibe} -d ${BBDD_NAME:-eduvibe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  eduvibe_api:
    build:
      context: ./src-api/EduvibeBackend
      dockerfile: ./Dockerfile
    container_name: eduvibe-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9090}:9090"
    environment:
      BBDD_HOST: db
      BBDD_PORT: 5432
      BBDD_NAME: ${BBDD_NAME:-eduvibe}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-eduvibe}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-eduvibe}
      APP_PORT: 9090
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME:-}}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      UPLOADS_DIR: /data/uploads
      # El front (nginx) va delante de la API y le pasa la IP real en X-Forwarded-For;
      # el límite de solicitudes de registro por IP la necesita. Con false, todos los
      # clientes parecerían la misma IP (la de nginx).
      TRUSTED_PROXY: ${TRUSTED_PROXY:-true}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  eduvibe_front:
    build:
      context: ./src-frontend/EduVibeFront
      dockerfile: ./Dockerfile
    container_name: eduvibe-front
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - eduvibe_api

volumes:
  postgres_data:
  uploads_data:
